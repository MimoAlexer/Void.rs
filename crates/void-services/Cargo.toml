[package]
name = "void-services"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wasm"]
wasm = ["dep:wasmtime"]

[dependencies]
void-sdk = { path = "../void-sdk" }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
libloading = "0.8"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros", "fs"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde"] }
wasmtime = { version = "49.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"], optional = true }
webbrowser = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
wat = "1"
